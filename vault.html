<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vault</title>
</head>
<body>

    <form id="vaultForm">
        <input type="text" id="vaultInput" placeholder="Enter code">
        <input type="submit" value="Submit">
    </form>

    <!-- Audio elements -->
    <audio id="vaultAudio" src="media/phone1.wav"></audio>
    <audio id="dontAudio" src="media/DONT.wav"></audio>
    <audio id="nilesAudio" src="media/niles.wav"></audio>

    <script>
        document.getElementById('vaultForm').addEventListener('submit', function(event) {
            event.preventDefault();
            
            var code = document.getElementById('vaultInput').value.trim();
            var audio = document.getElementById('vaultAudio');
            var dontAudio = document.getElementById('dontAudio');
            var nilesAudio = document.getElementById('nilesAudio');
            
            if (code === "5-26-26" || code === "26-5-26") {
                audio.play();
            }
            
            if (code === "exterminator" || code === "Exterminator" || code === "EXTERMINATOR") {
                dontAudio.play();
            }

            if (code === "niles" || code === "Niles" || code === "NILES") {
                // Turn the background black
                document.body.style.backgroundColor = "black";
                
                // Hide the form instead of deleting everything, so the audio stays alive
                document.getElementById('vaultForm').style.display = "none";
                
                // Play the audio file
                nilesAudio.play();
            }
        });
    </script>

</body>
</html>
