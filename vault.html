<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vault</title>
</head>
<body>

    <form id="vaultForm">
        <input type="text" id="vaultInput" placeholder="Enter code">
        <input type="submit" value="Submit">
    </form>

    <!-- Audio elements -->
    <audio id="vaultAudio" src="media/phone1.wav"></audio>
    <audio id="dontAudio" src="media/DONT.wav"></audio>
    <audio id="nilesAudio" src="media/niles.wav"></audio>
    <audio id="whoAudio" src="media/who.wav"></audio>

    <script>
        document.getElementById('vaultForm').addEventListener('submit', function(event) {
            event.preventDefault();
            
            var code = document.getElementById('vaultInput').value.trim();
            var audio = document.getElementById('vaultAudio');
            var dontAudio = document.getElementById('dontAudio');
            var nilesAudio = document.getElementById('nilesAudio');
            var whoAudio = document.getElementById('whoAudio');
            
            // Create a version of the code that is entirely lowercase for easy checking
            var lowerCode = code.toLowerCase();
            
            if (code === "5-26-26" || code === "26-5-26") {
                audio.play();
            }
            
            if (lowerCode === "exterminator") {
                dontAudio.play();
            }

            if (lowerCode === "niles") {
                // Turn the background black
                document.body.style.backgroundColor = "black";
                
                // Hide the form instead of deleting everything, so the audio stays alive
                document.getElementById('vaultForm').style.display = "none";
                
                // Play the audio file
                nilesAudio.play();
            }

            // Completely non-case-sensitive checks! "dan", "DAN", "dAn", etc. will all work now.
            if (lowerCode === "dan" || lowerCode === "bree" || lowerCode === "insanity" || lowerCode === "paranoia") {
                whoAudio.play();
            }
        });
    </script>

</body>
</html>
